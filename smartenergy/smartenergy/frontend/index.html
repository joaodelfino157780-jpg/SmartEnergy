<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartEnergy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header><h1>⚡ SmartEnergy</h1><span>Últimos 30 dias</span></header>
  <main>
    <section class="kpis">
      <div class="card"><small>Consumo</small><strong id="kpi-kwh">–</strong></div>
      <div class="card"><small>Custo estimado</small><strong id="kpi-custo">–</strong></div>
      <div class="card"><small>Previsão 7 dias</small><strong id="kpi-prev">–</strong></div>
      <div class="card"><small>Economia potencial/mês</small><strong id="kpi-eco">–</strong></div>
    </section>
    <section class="card wide"><h2>Histórico e previsão (kWh/dia)</h2><canvas id="chart" height="110"></canvas></section>
    <section class="card"><h2>Ranking de consumo</h2><div id="ranking"></div></section>
    <section class="card"><h2>Anomalias</h2><ul id="anomalies"></ul></section>
    <section class="card wide chat">
      <h2>Assistente</h2>
      <div id="log"></div>
      <form id="form"><input id="msg" placeholder="Ex.: qual aparelho mais gasta? como posso economizar?" autocomplete="off"><button>Enviar</button></form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
