<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartEnergy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>⚡ SmartEnergy</h1>
    <div class="right">
      <span id="plano" class="badge"></span>
      <button id="sair" class="btn small alt">Sair</button>
    </div>
  </header>
  <main>
    <section class="kpis">
      <div class="card"><small>Consumo (30 dias)</small><strong id="kpi-kwh">–</strong></div>
      <div class="card"><small>Custo estimado</small><strong id="kpi-custo">–</strong></div>
      <div class="card"><small>Previsão 7 dias (IA)</small><strong id="kpi-prev">–</strong></div>
      <div class="card"><small>Economia potencial/mês</small><strong id="kpi-eco">–</strong></div>
    </section>
    <section class="card wide"><h2>Histórico e previsão (kWh/dia)</h2><canvas id="chart" height="110"></canvas></section>
    <section class="card"><h2>Ranking de consumo</h2><div id="ranking"></div></section>
    <section class="card"><h2>Alertas de desperdício</h2><div id="anomalies"></div></section>
    <section class="card wide"><h2>Relatório avançado</h2><div id="relatorio" class="scroll"></div></section>
    <section class="card wide chat">
      <h2>Assistente virtual</h2>
      <div id="log"></div>
      <form id="form"><input id="msg" placeholder="Ex.: qual aparelho mais gasta? como posso economizar?" autocomplete="off"><button class="btn">Enviar</button></form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
